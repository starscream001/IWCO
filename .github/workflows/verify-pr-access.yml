name: Verify news PR access
on:
  push:
    branches: [codex/telegram-news-setup]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify permission against the existing setup PR
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title='Проверка доступа для новостей' -f head='codex/telegram-news-setup' -f base='main' > /tmp/pr.json 2>/tmp/pr-error; then
            # Normally GitHub rejects the duplicate of the existing setup PR.
            gh pr close "$(python3 -c 'import json;print(json.load(open("/tmp/pr.json"))["number"])')" --repo "$GITHUB_REPOSITORY"
          elif grep -q 'already exists' /tmp/pr-error; then
            echo 'PR access works; existing setup PR retained'
          else
            cat /tmp/pr-error
            exit 1
          fi
